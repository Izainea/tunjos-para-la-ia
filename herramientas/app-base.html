<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nombre de la mini app</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=PT+Sans:ital,wght@0,400;0,700;1,400&display=swap" />
<style>
/* Tokens idénticos al sitio. No cambiar nombres. */
:root{--bg:#F2F5F3;--surface:#FFFFFF;--ink:#14211D;--muted:#56675F;--rule:#D3DCD7;--accent:#0B6B58;--c-inv:#0B6B58;--c-app:#2B55B8;--c-blog:#9C2C83;--c-doc:#A8650F;--c-fil:#8A1C2B;--display:"PT Sans","Segoe UI",Arial,sans-serif;--text:"PT Sans","Segoe UI",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A17;--surface:#16241F;--ink:#E7EEE9;--muted:#9BAFA7;--rule:#273A32;--accent:#EBCB6B;--c-inv:#7FD6B8;--c-app:#93B5FF;--c-blog:#F09AD6;--c-doc:#F2A66B;--c-fil:#F08A9B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1A17;--surface:#16241F;--ink:#E7EEE9;--muted:#9BAFA7;--rule:#273A32;--accent:#EBCB6B;--c-inv:#7FD6B8;--c-app:#93B5FF;--c-blog:#F09AD6;--c-doc:#F2A66B;--c-fil:#F08A9B;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.5}
body{padding:1rem}
h1{font-family:var(--display);font-weight:700;font-size:1.25rem;margin:0 0 .25rem;letter-spacing:-.005em}
.k{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
p{margin:.4rem 0;color:var(--muted);font-size:.95rem}
button,select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:.35rem .7rem}
button{cursor:pointer;font-family:var(--mono);font-size:.78rem;letter-spacing:.05em;border-radius:999px}
button:hover{border-color:var(--muted)}
button[aria-pressed="true"],button.primary{color:var(--bg);background:var(--ink);border-color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:.8rem 1rem;margin:.6rem 0}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:.6rem}
svg text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.ok{color:var(--c-inv)} .no{color:var(--c-fil)} .ac{color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;vertical-align:top;padding:.4rem .6rem .4rem 0;border-bottom:1px solid var(--rule)}
th{font-family:var(--display);font-weight:700;border-bottom-color:var(--ink)}
.note{font-size:.85rem;font-style:italic;color:var(--muted)}
</style>
<script>
  // Mismo tema que la página que embebe la app (misma clave en localStorage).
  var t=null;try{t=localStorage.getItem('tema')}catch(e){}
  document.documentElement.dataset.theme=t||'dark';
  window.addEventListener('storage',function(e){if(e.key==='tema'){document.documentElement.dataset.theme=e.newValue||'dark'}});
</script>
</head>
<body>
  <span class="k">Mini app · Curso N · Semana M</span>
  <h1>Nombre de la mini app</h1>
  <p>Una frase que diga qué hace el estudiante aquí y qué debería notar.</p>

  <div class="card">
    <!-- Contenido interactivo -->
  </div>

  <p class="note">Qué se lleva de aquí: una frase que conecte lo que acaba de hacer con el concepto de la semana.</p>
<script>
  // Lógica. Sin dependencias externas salvo, si hace falta, d3 desde cdnjs.cloudflare.com.
</script>
</body>
</html>
